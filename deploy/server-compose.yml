# 内部验收专用；只有前端本机端口可访问，不能作为公网正式部署。
name: project-probe-staging
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectprobe
      POSTGRES_USER: projectprobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在服务器本机生成独立数据库密码}
    volumes:
      - staging_data:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectprobe -d projectprobe"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: server-backend.Dockerfile
    environment:
      PORT: 8080
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/projectprobe
      DB_USER: projectprobe
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ORIGIN: http://localhost:18088
      SECURE_COOKIE: "false"
      TRUSTED_PROXY_ADDRESSES: ${PROBE_STAGING_NETWORK_PREFIX:-172.30.90}.10
      MODEL_MODE: demo
      MODEL_API_KEY: ""
      PAYMENT_MODE: mock
      PAYMENT_OPERATIONS_ENABLED: "false"
      PAYMENT_RECONCILE_ENABLED: "false"
      ORDER_TTL_MINUTES: ${ORDER_TTL_MINUTES:-30}
      PAYMENT_EXPIRY_SYNC_ENABLED: ${PAYMENT_EXPIRY_SYNC_ENABLED:-false}
    mem_limit: 448m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18088:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    networks:
      proxy:
        ipv4_address: ${PROBE_STAGING_NETWORK_PREFIX:-172.30.90}.10
    depends_on:
      - backend
    restart: unless-stopped
networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROBE_STAGING_NETWORK_PREFIX:-172.30.90}.0/24
volumes:
  staging_data:
