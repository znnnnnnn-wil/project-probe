# 证书签发后再加载；不使用自签名证书冒充公网可信 HTTPS。
server {
    listen 443 ssl;
    server_name 39.96.27.134;
    ssl_certificate /certificates/live/project-probe-ip/fullchain.pem;
    ssl_certificate_key /certificates/live/project-probe-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    client_max_body_size 200k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 100s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
