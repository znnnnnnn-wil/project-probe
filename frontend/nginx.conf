server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /vad/ {
        types { application/wasm wasm; text/javascript mjs; application/octet-stream onnx; }
        try_files $uri =404;
    }
    location ~ "^/api/(resume/import|trainings/[a-f0-9-]{36}/transcribe)$" {
        client_max_body_size 7m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 100s;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # 不继承访客传入的转发头；只由本代理写入连接来源地址。
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 100s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
