name: Regression
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: regression
          POSTGRES_USER: projectprobe
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U projectprobe -d regression"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend against isolated PostgreSQL
        working-directory: backend
        run: mvn -B -ntp verify
        env:
          PROBE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/regression
          PROBE_TEST_DB_USER: projectprobe
          PROBE_TEST_DB_PASSWORD: synthetic-ci-only
          SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '3'
          SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install local synthetic speech fixture generator
        run: sudo apt-get install -y espeak-ng
      - name: Verify browser flows with demo model and mock payment
        run: npm run test:e2e
        working-directory: frontend
