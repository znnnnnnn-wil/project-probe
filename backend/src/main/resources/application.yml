server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: none
  error:
    include-message: never
logging:
  level:
    # SDK 错误日志可能包含完整交易响应；仅由业务层输出脱敏错误。
    sdk.biz.err: OFF
    sdk.biz.info: OFF
spring:
  task:
    scheduling:
      pool:
        size: 3
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/projectprobe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;WRITE_DELAY=0}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  origin: ${APP_ORIGIN:http://localhost:5173}
  trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  secure-cookie: ${SECURE_COOKIE:false}
  model-mode: ${MODEL_MODE:demo}
  model-timeout-seconds: ${MODEL_TIMEOUT_SECONDS:30}
  model-concurrency: ${MODEL_MAX_CONCURRENT_CALLS:4}
  extraction-daily-limit: ${EXTRACTION_DAILY_LIMIT:20}
  model-free-quota-only: ${MODEL_FREE_QUOTA_ONLY:false}
  model-free-quota-confirmed-model: ${MODEL_FREE_QUOTA_CONFIRMED_MODEL:}
  model-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
  model-key: ${MODEL_API_KEY:}
  model-name: ${MODEL_NAME:}
  model-provider: ${MODEL_PROVIDER:OpenAI-compatible}
  speech-enabled: ${SPEECH_ENABLED:false}
  speech-paid-allowed: ${SPEECH_PAID_ALLOWED:false}
  speech-free-quota-confirmed-model: ${SPEECH_FREE_QUOTA_CONFIRMED_MODEL:}
  speech-model: ${SPEECH_MODEL:qwen3-asr-flash}
  speech-url: ${SPEECH_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  speech-key: ${SPEECH_API_KEY:}
  speech-daily-limit: ${SPEECH_DAILY_LIMIT:20}
  payment-mode: ${PAYMENT_MODE:mock}
  payment:
    mode: ${PAYMENT_MODE:mock}
    price-cents: ${TRAINING_PRICE_CENTS:990}
    order-ttl-minutes: ${ORDER_TTL_MINUTES:30}
    expiry-sync-enabled: ${PAYMENT_EXPIRY_SYNC_ENABLED:false}
    reconcile-enabled: ${PAYMENT_RECONCILE_ENABLED:false}
    operations-enabled: ${PAYMENT_OPERATIONS_ENABLED:false}
    sandbox:
      app-id: ${ALIPAY_SANDBOX_APP_ID:}
      seller-id: ${ALIPAY_SANDBOX_SELLER_ID:}
      private-key-file: ${ALIPAY_SANDBOX_PRIVATE_KEY_FILE:}
      public-key-file: ${ALIPAY_SANDBOX_PUBLIC_KEY_FILE:}
      notify-url: ${ALIPAY_SANDBOX_NOTIFY_URL:}
      return-url: ${ALIPAY_SANDBOX_RETURN_URL:http://localhost:5173/payment-return}
      merchant-confirmed: ${ALIPAY_SANDBOX_MERCHANT_CONFIRMED:false}
    production:
      app-id: ${ALIPAY_PRODUCTION_APP_ID:}
      seller-id: ${ALIPAY_PRODUCTION_SELLER_ID:}
      private-key-file: ${ALIPAY_PRODUCTION_PRIVATE_KEY_FILE:}
      public-key-file: ${ALIPAY_PRODUCTION_PUBLIC_KEY_FILE:}
      notify-url: ${ALIPAY_PRODUCTION_NOTIFY_URL:}
      return-url: ${ALIPAY_PRODUCTION_RETURN_URL:}
      merchant-confirmed: ${ALIPAY_PRODUCTION_MERCHANT_CONFIRMED:false}
